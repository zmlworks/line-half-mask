<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行の半分マスク</title>
  <style>
    body {
      font: 16px/1.4 sans-serif;
      margin: 0;
      padding: 12px;
      width: 228px;
      background: #f6f4ef;
      color: #222;
    }
    body.has-shortcuts {
      width: 260px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
      font-weight: 700;
    }
    h2 {
      font-size: 13px;
      margin: 14px 0 8px;
      font-weight: 700;
    }
    button {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      padding: 10px 8px;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      color: #111;
    }
    button:active {
      background: #eee;
    }
    #toggle.on {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .note, .err {
      font-size: 12px;
      color: #555;
      margin: 4px 0 0;
    }
    .err {
      color: #a40000;
    }
    .shortcut, .ratio, .stripe {
      display: block;
      margin: 0 0 8px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin: 0 0 8px;
    }
    .check input {
      width: auto;
      margin: 0;
    }
    .shortcut span, .ratio span, .stripe span {
      display: block;
      font-size: 12px;
      margin: 0 0 3px;
    }
    .shortcut input, .ratio input, .stripe input[type="number"] {
      box-sizing: border-box;
      width: 100%;
      padding: 8px 8px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      color: #111;
    }
    .shortcut input:focus, .ratio input:focus, .stripe input:focus {
      outline: 2px solid #222;
      outline-offset: 1px;
    }
    #shortcut-reset {
      font-size: 14px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>行の半分マスク</h1>
  <button id="toggle" type="button">オンにする</button>
  <button id="swap" type="button">塗りを入れ替え</button>
  <p id="status" class="note"></p>
  <label class="ratio">
    <span>マスクの割合（パーセント）</span>
    <input id="ratio" type="number" min="50" max="90" step="1" value="50">
  </label>
  <p class="note">50 から 90 までの整数です。</p>
  <label class="stripe">
    <span>縞の幅（ピクセル）</span>
    <input id="stripe-width" type="number" min="1" max="16" step="1" value="8">
  </label>
  <p class="note">1 から 16 までの整数です。</p>
  <label class="stripe">
    <span>速さ（ピクセル毎秒）</span>
    <input id="stripe-speed" type="number" min="0" max="60" step="1" value="30">
  </label>
  <p class="note">0 から 60 までの整数です。0 で止まります。</p>
  <label class="check">
    <input id="random-angle" type="checkbox">
    <span>線の傾きをランダム</span>
  </label>
  <label class="check">
    <input id="random-dir" type="checkbox">
    <span>進む向きをランダム</span>
  </label>
  <section id="shortcuts" hidden>
    <h2>ショートカット</h2>
    <label class="shortcut">
      <span>マスクのオンオフ</span>
      <input id="shortcut-toggle" type="text" readonly spellcheck="false" autocomplete="off">
    </label>
    <label class="shortcut">
      <span>塗りを入れ替え</span>
      <input id="shortcut-swap" type="text" readonly spellcheck="false" autocomplete="off">
    </label>
    <button id="shortcut-reset" type="button">既定に戻す</button>
    <p id="shortcut-msg" class="note"></p>
  </section>
  <script src="shortcuts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
