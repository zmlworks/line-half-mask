<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行の半分マスク</title>
  <style>
    body {
      font: 16px/1.4 sans-serif;
      margin: 0;
      padding: 12px;
      width: 228px;
      background: #f6f4ef;
      color: #222;
    }
    body.has-shortcuts {
      width: 260px;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
      font-weight: 700;
    }
    h2 {
      font-size: 13px;
      margin: 14px 0 8px;
      font-weight: 700;
    }
    button {
      display: block;
      width: 100%;
      margin: 0 0 8px;
      padding: 10px 8px;
      font-size: 15px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      color: #111;
    }
    button:active {
      background: #eee;
    }
    #toggle.on, #overlay-selection.on {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .note, .err {
      font-size: 12px;
      color: #555;
      margin: 4px 0 0;
    }
    .err {
      color: #a40000;
    }
    .shortcut, .ratio, .stripe {
      display: block;
      margin: 0 0 8px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      margin: 0 0 8px;
    }
    .check input {
      width: auto;
      margin: 0;
    }
    .shortcut span, .ratio span, .stripe span {
      display: block;
      font-size: 12px;
      margin: 0 0 3px;
    }
    .shortcut input, .ratio input, .stripe input[type="number"] {
      box-sizing: border-box;
      width: 100%;
      padding: 8px 8px;
      font-size: 14px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      color: #111;
    }
    .shortcut input:focus, .ratio input:focus, .stripe input:focus {
      outline: 2px solid #222;
      outline-offset: 1px;
    }
    .enh {
      display: block;
      margin: 0 0 8px;
    }
    .enh span, .radios > span {
      display: block;
      font-size: 12px;
      margin: 0 0 3px;
    }
    .enh input[type="range"] {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 0;
    }
    .radios {
      margin: 0 0 8px;
    }
    .radios label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      margin: 0 10px 0 0;
    }
    .radios input {
      margin: 0;
    }
    .pad-wrap {
      margin: 0 0 8px;
    }
    .pad-wrap > span {
      display: block;
      font-size: 12px;
      margin: 0 0 3px;
    }
    .pad {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      gap: 4px;
      width: 100%;
    }
    .pad button {
      width: 100%;
      margin: 0;
      padding: 8px 4px;
      font-size: 13px;
    }
    .pad [data-dir="up"] { grid-area: up; }
    .pad [data-dir="left"] { grid-area: left; }
    .pad [data-dir="right"] { grid-area: right; }
    .pad [data-dir="down"] { grid-area: down; }
    .pad button.on {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .panel {
      margin: 0 0 0 0;
    }
    .panel[hidden] {
      display: none;
    }
    #shortcut-reset {
      font-size: 14px;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>行の半分マスク</h1>
  <button id="toggle" type="button">オンにする</button>
  <button id="swap" type="button">塗りを入れ替え</button>
  <button id="overlay-selection" type="button">選択範囲に重ねる</button>
  <p id="status" class="note"></p>
  <p class="note">文字を選んで、右クリックの「選択範囲に行マスク」か上のボタンで始めます。十字のボタンか矢印キーで範囲を選びます。Esc か、範囲の外をクリックかタップで終わります。</p>
  <div class="pad-wrap">
    <span>重ねる範囲</span>
    <div class="pad" role="radiogroup" aria-label="重ねる範囲">
      <button type="button" tabindex="-1" role="radio" data-coverage="top" data-dir="up">上半分</button>
      <button type="button" tabindex="-1" role="radio" data-coverage="full" data-dir="left">オン</button>
      <button type="button" tabindex="-1" role="radio" data-coverage="off" data-dir="right">オフ</button>
      <button type="button" tabindex="-1" role="radio" data-coverage="bottom" data-dir="down">下半分</button>
    </div>
  </div>
  <div class="radios">
    <span>塗り</span>
    <label><input type="radio" name="fill" value="black">黒塗り</label>
    <label><input type="radio" name="fill" value="enhance">視覚増強</label>
  </div>
  <label class="ratio">
    <span>マスクの割合（パーセント）</span>
    <input id="ratio" type="number" min="50" max="90" step="1" value="50">
  </label>
  <p class="note">50 から 90 までの整数です。</p>
  <div id="black-panel" class="panel">
  <h2>黒塗りの設定</h2>
  <label class="stripe">
    <span>白の幅（ピクセル）</span>
    <input id="stripe-white" type="number" min="1" max="16" step="1" value="8">
  </label>
  <label class="stripe">
    <span>黒の幅（ピクセル）</span>
    <input id="stripe-black" type="number" min="1" max="16" step="1" value="8">
  </label>
  <p class="note">それぞれ 1 から 16 までの整数です。</p>
  <label class="stripe">
    <span>速さ（ピクセル毎秒）</span>
    <input id="stripe-speed" type="number" min="0" max="60" step="1" value="30">
  </label>
  <p class="note">0 から 60 までの整数です。0 で止まります。</p>
  <label class="check">
    <input id="random-angle" type="checkbox">
    <span>線の傾きと流れの左右をランダム</span>
  </label>
  <p class="note">オフのときは 45 度で、縞を横切る向きに進みます。オンのときは傾きと、法線の左右がランダムになります。</p>
  </div>
  <div id="enhance-panel" class="panel">
  <h2>視覚増強の設定</h2>
  <label class="check">
    <input id="enh-auto" type="checkbox">
    <span>ゆっくりランダムに変化</span>
  </label>
  <div id="enh-auto-panel" class="panel">
    <label class="enh">
      <span id="enh-dist-v"></span>
      <input id="enh-dist" type="range" min="0" max="1000" step="1">
    </label>
    <p id="enh-hint" class="note"></p>
  </div>
  <div id="enh-manual-panel" class="panel">
    <label class="enh">
      <span id="enh-speed-v"></span>
      <input id="enh-speed" type="range" min="0" max="1000" step="1">
    </label>
    <div class="radios">
      <span>流れの向き</span>
      <label><input type="radio" name="enh-dir" value="1">順方向</label>
      <label><input type="radio" name="enh-dir" value="-1">逆方向</label>
    </div>
    <label class="check">
      <input id="enh-rotate" type="checkbox">
      <span>回転させる</span>
    </label>
    <div id="enh-rot-panel" class="panel">
      <label class="enh">
        <span id="enh-rot-v"></span>
        <input id="enh-rot" type="range" min="0" max="1000" step="1">
      </label>
      <div class="radios">
        <span>回転の向き</span>
        <label><input type="radio" name="enh-rotdir" value="1">時計回り</label>
        <label><input type="radio" name="enh-rotdir" value="-1">反時計回り</label>
      </div>
      <label class="check">
        <input id="enh-wander" type="checkbox">
        <span>回転の軸を動かす</span>
      </label>
    </div>
  </div>
  <label class="enh">
    <span id="enh-width-v"></span>
    <input id="enh-width" type="range" min="1" max="64" step="1">
  </label>
  <div class="radios">
    <span>色</span>
    <label><input type="radio" name="enh-color" value="0">白黒</label>
    <label><input type="radio" name="enh-color" value="1">色モード</label>
  </div>
  <div id="enh-color-panel" class="panel">
    <label class="enh">
      <span id="enh-hue-v"></span>
      <input id="enh-hue" type="range" min="0" max="1000" step="1">
    </label>
  </div>
  </div>
  <section id="shortcuts" hidden>
    <h2>ショートカット</h2>
    <label class="shortcut">
      <span>マスクのオンオフ</span>
      <input id="shortcut-toggle" type="text" readonly spellcheck="false" autocomplete="off">
    </label>
    <label class="shortcut">
      <span>塗りを入れ替え</span>
      <input id="shortcut-swap" type="text" readonly spellcheck="false" autocomplete="off">
    </label>
    <button id="shortcut-reset" type="button">既定に戻す</button>
    <p id="shortcut-msg" class="note"></p>
  </section>
  <script src="enhance.js"></script>
  <script src="shortcuts.js"></script>
  <script src="popup.js"></script>
</body>
</html>
